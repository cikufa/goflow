# Released Gears settings; enable the exact commented central_value_config.
# Explicit paper-feature reconstruction, not the released default configuration.
params:
  seed: 42
  env:
    clip_observations: 5.0
    clip_actions: 1.0
  algo:
    name: my_agent
  model:
    name: my_actor_model
  network:
    name: my_network
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true
    mlp:
      units:
      - 256
      - 128
      - 64
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
  load_checkpoint: false
  load_path: ''
  config:
    name: apa_impedance
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: false
    normalize_value: true
    num_actors: 1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: None
    kl_threshold: 0.008
    score_to_win: 20000
    max_frames: 1000000
    save_best_after: 20
    save_frequency: 25
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: -1
    mini_epochs: 8
    critic_coef: 1
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.0001
    player:
      render: false
      games_num: 100
      deterministic: false
    dr_method:
      name: GOFLOW
      train_per_update: 4096
      val_per_update: 4096
      num_training_iters: 100
      alpha: 0.5
      beta: 1.0
      success_threshold: 50
    central_value_config:
      minibatch_size: 2048
      mini_epochs: 4
      learning_rate: 0.0005
      clip_value: true
      normalize_input: true
      normalize_value: true
      network:
        name: actor_critic
        central_value: true
        mlp:
          units:
          - 512
          - 256
          activation: relu
          initializer:
            name: default
          regularizer:
            name: None
